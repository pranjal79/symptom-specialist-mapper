name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.10"

jobs:

  # ── Job 1: Lint + Test ──────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 src/ app/ --count --select=E9,F63,F7,F82 --show-source --statistics

          # Warnings only — don't fail on style issues
          flake8 src/ app/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run smoke tests
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.data_ingestion import load_config
          cfg = load_config()
          print('✅ Config loaded:', cfg.keys())
          "

  # ── Job 2: Docker Build ─────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: symptom-specialist-mapper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to HuggingFace Spaces ────────────────────
  deploy-to-hf:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install HuggingFace Hub CLI
        run: pip install "huggingface_hub[cli]"

      - name: Create Space and Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}

        run: |
          python - <<'EOF'
          import os
          import time
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          username = os.environ["HF_USERNAME"]
          repo_id  = f"{username}/symptom-specialist-mapper"

          # ── Step 1: Create HF Space ─────────────────────────
          print(f"Creating space: {repo_id}")

          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  token=os.environ["HF_TOKEN"],
                  exist_ok=True,
                  private=False,
              )

              print(f"✅ Space created/exists: {repo_id}")

              # Small delay so HF can initialize repo
              time.sleep(3)

          except Exception as e:
              print(f"Create repo error: {e}")

          # ── Step 2: Upload Files ────────────────────────────
          print("Uploading files...")

          try:
              api.upload_folder(
                  folder_path=".",
                  repo_id=repo_id,
                  repo_type="space",
                  token=os.environ["HF_TOKEN"],

                  ignore_patterns=[
                      ".git*",
                      "venv/",
                      "__pycache__/",
                      "*.pyc",
                      ".dvc/cache/",
                      "mlruns/",
                      "data/raw/",
                      ".env",
                      "*.dvc",
                  ],
              )

              print(f"✅ Deployed to https://huggingface.co/spaces/{repo_id}")

          except Exception as e:
              print(f"Upload error: {e}")
              raise

          EOF